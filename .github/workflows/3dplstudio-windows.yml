name: 3DPL Studio Windows

on:
  push:
    paths:
      - "desktop/3DPLStudio/**"
      - ".github/workflows/3dplstudio-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3dplstudio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S desktop/3DPLStudio -B desktop/3DPLStudio/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/desktop/3DPLStudio/dist"

      - name: Build
        shell: pwsh
        run: cmake --build desktop/3DPLStudio/build --config Release --parallel

      - name: Install and deploy Qt
        shell: pwsh
        run: |
          cmake --install desktop/3DPLStudio/build --config Release
          $exe = "${{ github.workspace }}/desktop/3DPLStudio/dist/3DPLStudio.exe"
          if (!(Test-Path $exe)) { throw "3DPLStudio.exe not found" }
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw $exe

      - name: Create portable package
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/desktop/3DPLStudio/dist"
          $zip = "${{ github.workspace }}/3DPLStudio-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DPLStudio-Windows-x64
          path: 3DPLStudio-Windows-x64.zip

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "3DPLStudio-Windows-x64.zip"
          gh release view 3dplstudio-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            git tag -f 3dplstudio-latest $env:GITHUB_SHA
            git push --force origin refs/tags/3dplstudio-latest
            gh release upload 3dplstudio-latest $asset --clobber
            gh release edit 3dplstudio-latest --title "3DPL Studio Windows Latest" --notes "Native Qt/C++ Windows editor for 3DPL tours."
          } else {
            gh release create 3dplstudio-latest $asset --target $env:GITHUB_SHA --title "3DPL Studio Windows Latest" --notes "Native Qt/C++ Windows editor for 3DPL tours."
          }
