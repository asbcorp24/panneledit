name: Object360 Android APK
# CI validation trigger

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-apk.yml"
  push:
    branches: [ main ]
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/Object360Capture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/Object360Capture-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Object360Capture-debug-apk
          path: apk/Object360Capture-debug.apk
          if-no-files-found: error
          retention-days: 30
