name: Build XREAL Stereo Panorama APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/XrealStereoPanorama/**'
      - '.github/workflows/build-xreal-stereo-panorama.yml'
      - '!android/XrealStereoPanorama/APK/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android/XrealStereoPanorama
        run: gradle clean assembleDebug --no-daemon
      - name: Copy APK
        run: |
          mkdir -p android/XrealStereoPanorama/APK
          cp android/XrealStereoPanorama/app/build/outputs/apk/debug/app-debug.apk android/XrealStereoPanorama/APK/XREAL-Stereo-Panorama-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XREAL-Stereo-Panorama-debug
          path: android/XrealStereoPanorama/APK/XREAL-Stereo-Panorama-debug.apk
      - name: Commit APK back to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android/XrealStereoPanorama/APK/XREAL-Stereo-Panorama-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m 'build: XREAL Stereo Panorama debug APK'
          git push
