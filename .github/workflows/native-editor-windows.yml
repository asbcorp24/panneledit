name: Native Windows Editor

on:
  push:
    paths:
      - "windows/EditorNative/**"
      - ".github/workflows/native-editor-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-editor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S windows/EditorNative -B build/native-editor `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build/native-editor --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/3DPLEditor | Out-Null
          Copy-Item build/native-editor/Release/3DPLEditor.exe dist/3DPLEditor/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            dist/3DPLEditor/3DPLEditor.exe
          Copy-Item windows/EditorNative/README.md dist/3DPLEditor/
          Compress-Archive -Path dist/3DPLEditor/* `
            -DestinationPath 3DPLEditor-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DPLEditor-Windows-x64
          path: 3DPLEditor-Windows-x64.zip

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view editor-native-latest 2>$null) {
            git tag -f editor-native-latest "$env:GITHUB_SHA"
            git push --force origin refs/tags/editor-native-latest
            gh release upload editor-native-latest 3DPLEditor-Windows-x64.zip --clobber
            gh release edit editor-native-latest `
              --title "3DPL Native Windows Editor Latest" `
              --notes "Native C++/Qt 6 desktop editor build."
          } else {
            gh release create editor-native-latest 3DPLEditor-Windows-x64.zip `
              --target "$env:GITHUB_SHA" `
              --title "3DPL Native Windows Editor Latest" `
              --notes "Native C++/Qt 6 desktop editor build."
          }
