name: OpenXRPlayer Android

on:
  push:
    paths:
      - "android/OpenXRPlayer/**"
      - "assets/app.js"
      - ".github/workflows/openxrplayer-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openxrplayer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK + NDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android/OpenXRPlayer
        run: gradle clean assembleDebug --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p android/OpenXRPlayer/APK
          cp android/OpenXRPlayer/app/build/outputs/apk/debug/app-debug.apk \
             android/OpenXRPlayer/APK/OpenXRPlayer-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenXRPlayer-debug
          path: android/OpenXRPlayer/APK/OpenXRPlayer-debug.apk

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/OpenXRPlayer/APK/OpenXRPlayer-debug.apk OpenXRPlayer-debug.apk

          if gh release view openxrplayer-latest >/dev/null 2>&1; then
            git tag -f openxrplayer-latest "$GITHUB_SHA"
            git push --force origin refs/tags/openxrplayer-latest
            gh release upload openxrplayer-latest OpenXRPlayer-debug.apk --clobber
            gh release edit openxrplayer-latest \
              --title "OpenXR Tour Player Latest" \
              --notes "Native OpenXR Android player for .player.zip tours with openxr-manifest.json."
          else
            gh release create openxrplayer-latest OpenXRPlayer-debug.apk \
              --target "$GITHUB_SHA" \
              --title "OpenXR Tour Player Latest" \
              --notes "Native OpenXR Android player for .player.zip tours with openxr-manifest.json."
          fi
