name: Object360 Android

on:
  push:
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-android.yml"
  pull_request:
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: object360-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/Object360Capture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android API 37
        run: android sdk install platform-tools platforms/android-37.0 build-tools/37.0.0

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Object360Capture-debug
          path: android/Object360Capture/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Object360Capture-debug.apk

          if gh release view object360-latest >/dev/null 2>&1; then
            git tag -f object360-latest "$GITHUB_SHA"
            git push --force origin refs/tags/object360-latest

            gh release upload object360-latest Object360Capture-debug.apk --clobber
            gh release edit object360-latest \
              --title "Object360Capture Latest" \
              --notes "Автоматически обновляемая актуальная APK-сборка Object360Capture из ветки main."
          else
            gh release create object360-latest Object360Capture-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Object360Capture Latest" \
              --notes "Автоматически обновляемая актуальная APK-сборка Object360Capture из ветки main."
          fi
