name: Object360 Android

on:
  push:
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: object360-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android/Object360Capture
        run: gradle clean assembleDebug --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p android/Object360Capture/APK
          cp android/Object360Capture/app/build/outputs/apk/debug/app-debug.apk \
             android/Object360Capture/APK/Object360Capture-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Object360Capture-debug
          path: android/Object360Capture/APK/Object360Capture-debug.apk

      - name: Commit APK back to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/Object360Capture/APK/Object360Capture-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Object360Capture debug APK [skip ci]"
            git push
          fi

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/Object360Capture/APK/Object360Capture-debug.apk Object360Capture-debug.apk

          if gh release view object360-latest >/dev/null 2>&1; then
            git tag -f object360-latest "$GITHUB_SHA"
            git push --force origin refs/tags/object360-latest
            gh release upload object360-latest Object360Capture-debug.apk --clobber
            gh release edit object360-latest \
              --title "Object360Capture Latest" \
              --notes "Автоматически обновляемая актуальная APK-сборка Object360Capture из ветки main."
          else
            gh release create object360-latest Object360Capture-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Object360Capture Latest" \
              --notes "Автоматически обновляемая актуальная APK-сборка Object360Capture из ветки main."
          fi
