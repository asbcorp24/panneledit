name: Object360 Android

on:
  push:
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-android.yml"
  pull_request:
    paths:
      - "android/Object360Capture/**"
      - ".github/workflows/object360-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/Object360Capture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android API 37
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Object360Capture-debug
          path: android/Object360Capture/app/build/outputs/apk/debug/app-debug.apk
