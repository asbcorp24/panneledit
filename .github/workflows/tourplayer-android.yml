name: TourPlayer Android

on:
  push:
    paths:
      - "android/TourPlayer/**"
      - "index.html"
      - "assets/app.js"
      - ".github/workflows/tourplayer-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourplayer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android/TourPlayer
        run: gradle clean assembleDebug --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p android/TourPlayer/APK
          cp android/TourPlayer/app/build/outputs/apk/debug/app-debug.apk              android/TourPlayer/APK/TourPlayer-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TourPlayer-debug
          path: android/TourPlayer/APK/TourPlayer-debug.apk

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/TourPlayer/APK/TourPlayer-debug.apk TourPlayer-debug.apk

          if gh release view tourplayer-latest >/dev/null 2>&1; then
            git tag -f tourplayer-latest "$GITHUB_SHA"
            git push --force origin refs/tags/tourplayer-latest
            gh release upload tourplayer-latest TourPlayer-debug.apk --clobber
            gh release edit tourplayer-latest               --title "XR Tour Player Latest"               --notes "Актуальная Android-сборка XR Tour Player для оптимизированных .player.zip пакетов."
          else
            gh release create tourplayer-latest TourPlayer-debug.apk               --target "$GITHUB_SHA"               --title "XR Tour Player Latest"               --notes "Актуальная Android-сборка XR Tour Player для оптимизированных .player.zip пакетов."
          fi
