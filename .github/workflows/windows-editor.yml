name: 3DPL Windows Editor

on:
  push:
    paths:
      - "windows/3dpl-editor/**"
      - ".github/workflows/windows-editor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Player runtime
        shell: pwsh
        run: node --check windows/3dpl-editor/runtime/tour.js

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          modules: "qtmultimedia"
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S windows/3dpl-editor -B windows/3dpl-editor/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build windows/3dpl-editor/build --config Release --parallel

      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/3dpl-editor/dist | Out-Null
          Copy-Item windows/3dpl-editor/build/Release/3dpl-editor.exe windows/3dpl-editor/dist/
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations windows/3dpl-editor/dist/3dpl-editor.exe

          New-Item -ItemType Directory -Force -Path windows/3dpl-editor/dist/runtime/assets | Out-Null
          Copy-Item windows/3dpl-editor/runtime/index.html windows/3dpl-editor/dist/runtime/index.html
          Copy-Item windows/3dpl-editor/runtime/player.css windows/3dpl-editor/dist/runtime/assets/player.css
          Copy-Item windows/3dpl-editor/runtime/tour.js windows/3dpl-editor/dist/runtime/assets/tour.js
          Copy-Item assets/three.module.min.js windows/3dpl-editor/dist/runtime/assets/three.module.min.js
          Copy-Item assets/xr-media-viewer.js windows/3dpl-editor/dist/runtime/assets/xr-media-viewer.js
          Copy-Item assets/object360-xr-viewer.js windows/3dpl-editor/dist/runtime/assets/object360-xr-viewer.js
          Copy-Item assets/multires-panorama-viewer.js windows/3dpl-editor/dist/runtime/assets/multires-panorama-viewer.js

          Compress-Archive -Path windows/3dpl-editor/dist/* -DestinationPath 3DPL-Editor-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DPL-Editor-Windows
          path: 3DPL-Editor-Windows.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view windows-editor-latest 2>$null) {
            git tag -f windows-editor-latest $env:GITHUB_SHA
            git push --force origin refs/tags/windows-editor-latest
            gh release upload windows-editor-latest 3DPL-Editor-Windows.zip --clobber
            gh release edit windows-editor-latest --title "3DPL Windows Editor Latest" --notes "Native C++/Qt Windows editor."
          } else {
            gh release create windows-editor-latest 3DPL-Editor-Windows.zip --target $env:GITHUB_SHA --title "3DPL Windows Editor Latest" --notes "Native C++/Qt Windows editor."
          }
